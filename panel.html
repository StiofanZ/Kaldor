<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络代理</title>
<style>
:root{color-scheme:dark;--bg:#18232b;--panel:#22323d;--input:#17262f;--edge:#415562;--text:#f0f5f7;--muted:#b6c6cf;--accent:#77d6d1}
*{box-sizing:border-box}
body{margin:0;padding:18px;background:var(--bg);color:var(--text);font:14px/1.5 "Source Sans 3","PingFang SC","Microsoft YaHei",sans-serif}
h1,p{margin:0}h1{font-size:24px;font-weight:650;line-height:1.25}
header,.section-head,.entry,.actions,.row-tools,.service-state{display:flex;align-items:center;gap:10px}
header,.section-head{justify-content:space-between;flex-wrap:wrap}
header{padding:3px 0 14px;border-bottom:2px solid var(--accent)}
.service-state{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
#status{padding:2px 9px;border:1px solid var(--edge);border-radius:12px}
#status[data-state=running]{color:#a5eaca;border-color:#4e826d}
#status[data-state=degraded]{color:#ffcf87;border-color:#956e40}
[hidden]{display:none!important}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:14px 0}
.tabs button{min-width:0;padding:8px 3px;border-color:transparent;background:transparent;color:var(--muted)}
.tabs button[aria-selected=true]{background:var(--panel);border-color:var(--edge);box-shadow:inset 0 -2px var(--accent);color:var(--text)}
#release{margin-top:16px;padding-top:12px;border-top:1px solid var(--edge)}
#release strong{margin-right:auto}
.activity-head{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.activity-list article{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--edge);overflow-wrap:anywhere}
.activity-list{margin-top:10px}.activity-list small{grid-column:1/-1}
@media(max-width:410px){.tabs{grid-template-columns:repeat(3,minmax(0,1fr))}}
#releaseResult:not(:empty){display:block;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.section-head{justify-content:flex-end;margin-bottom:10px}
.fields,fieldset{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
fieldset{min-width:0;margin:10px 0 0;padding:12px;background:var(--bg);border:1px solid var(--edge);border-radius:6px}
label{display:flex;flex-direction:column;gap:4px;min-width:0;color:var(--text)}
.port-field small{display:block;margin-top:4px}
.wide,.entry{grid-column:1/-1}
.toggle{flex-direction:row;align-items:center;gap:7px}
input,select,textarea{min-width:0;width:100%;color:var(--text);background:var(--input);border:1px solid #617683;border-radius:4px;padding:6px 9px;font:inherit}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
textarea{min-height:56px;resize:vertical}
small,.hint{font-size:13px;color:var(--muted)}
#nodes:not(:empty) + #noNodes{display:none}
button{font:inherit;color:var(--text);background:#304651;border:1px solid #617683;border-radius:5px;padding:5px 11px;cursor:pointer}
button:hover:enabled{background:#3c5562}button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.entry{flex-wrap:wrap;padding-bottom:8px;border-bottom:1px solid var(--edge)}
.entry strong{margin-right:auto;overflow-wrap:anywhere}
.row-tools{flex-wrap:wrap;gap:6px}.row-tools button{font-size:13px}
.actions{padding:10px 0;background:var(--bg);border-top:1px solid var(--edge)}
button[type=submit]{background:var(--accent);color:#102d31;border-color:var(--accent);font-weight:650}
button[type=submit]:hover:enabled{background:#9be6e0}
output{overflow-wrap:anywhere}
@media(max-width:520px){
 body{padding:10px}.card{padding:12px}.fields,fieldset{grid-template-columns:minmax(0,1fr)}
 h1{font-size:20px}.entry{align-items:flex-start}.actions{flex-wrap:wrap}
}
</style>
<header><h1>网络代理</h1><div class="service-state"><span>内核：Kaldor vCOMPONENT_VERSION</span><output id="status" aria-live="polite"></output></div></header>
<div class="tabs" role="tablist" aria-label="网络代理">
<button type="button" role="tab" id="tab-general" aria-controls="general" aria-selected="true">参数设置</button>
<button type="button" role="tab" id="tab-nodes" aria-controls="nodePanel" aria-selected="false" tabindex="-1">上游节点</button>
<button type="button" role="tab" id="tab-rules" aria-controls="rulePanel" aria-selected="false" tabindex="-1">分流规则</button>
<button type="button" role="tab" id="tab-connections" aria-controls="connections" aria-selected="false" tabindex="-1">活动连接</button>
<button type="button" role="tab" id="tab-access" aria-controls="access" aria-selected="false" tabindex="-1">访问日志</button>
</div>
<form id="settings" novalidate>
<section class="card" id="general" role="tabpanel" aria-labelledby="tab-general">
<div id="parameters" data-config inert><div class="section-head"><label class="toggle"><input id="enabled" type="checkbox">启用代理</label></div>
<div class="fields">
<div class="port-field"><label for="listenPort">代理端口<input id="listenPort" type="number" min="1" max="65535" step="1" required aria-describedby="portHint"></label>
<small id="portHint">HTTP 和 SOCKS5 均使用此端口，默认 6000。更改后请同步更新客户端。</small></div>
<label>默认出口<select id="fallback"></select></label>
<label class="wide" for="devices">透明代理设备<textarea id="devices" placeholder="每行一个 IPv4 网段，单台设备用 /32" aria-describedby="devicesHint"></textarea></label>
<small class="wide" id="devicesHint">接管所选设备的公网 IPv4 流量，DNS（TCP/UDP 53）经所选出口加密解析。留空时只启用手动代理。</small>
</div></div>
<section id="release" data-phase="RELEASE_PHASE" data-version="RELEASE_VERSION" data-installed="COMPONENT_VERSION">
<div class="row-tools"><strong>组件更新</strong><button type="button" id="checkRelease">检查新版本</button>
<button type="button" id="installRelease" hidden>升级组件</button></div>
<output id="releaseResult" role="status"></output></section>
</section>
<section class="card" id="nodePanel" data-config inert role="tabpanel" aria-labelledby="tab-nodes" hidden><div class="section-head"><button type="button" id="newNode">添加节点</button></div>
<div id="nodes"></div><p class="hint" id="noNodes">尚未添加上游节点。</p></section>
<section class="card" id="rulePanel" data-config inert role="tabpanel" aria-labelledby="tab-rules" hidden><div class="section-head"><button type="button" id="newRule">添加规则</button></div>
<p class="hint">按从上到下的顺序匹配，首条满足全部条件的规则生效。未命中时使用默认出口。</p><div id="rules"></div></section>
<div class="actions" data-config inert><button type="submit">保存并应用</button><output role="status" id="result"></output></div></form>
<section class="card" id="connections" role="tabpanel" aria-labelledby="tab-connections" hidden>
<div class="activity-head"><output role="status"></output><button type="button">刷新连接</button></div>
<div class="activity-list"></div></section>
<section class="card" id="access" role="tabpanel" aria-labelledby="tab-access" hidden>
<div class="activity-head"><output role="status"></output><button type="button">刷新日志</button></div>
<p class="hint">仅保留最近 128 次代理出站结果。设备代号在本次运行期间有效，服务重启后记录清空。</p>
<div class="activity-list"></div></section>
<script type="application/json" id="activity-data">ACTIVITY_SNAPSHOT</script>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const tabs=Array.from(document.querySelectorAll('[role="tab"]'));
function selectTab(active){
 for(const tab of tabs){
  const selected=tab===active;
  tab.tabIndex=selected?0:-1;
  tab.setAttribute('aria-selected',String(selected));
  byId(tab.getAttribute('aria-controls')).hidden=!selected;
 }
 const panel=byId(active.getAttribute('aria-controls'));
 byId('settings').hidden=!byId('settings').contains(panel);
 if(byId('settings').hidden)refreshActivity(panel);
}
for(const [index,tab] of tabs.entries()){
 tab.onclick=()=>selectTab(tab);
 tab.onkeydown=event=>{
  const next={ArrowLeft:(index+tabs.length-1)%tabs.length,ArrowRight:(index+1)%tabs.length,Home:0,End:tabs.length-1}[event.key];
  if(next===undefined)return;
  event.preventDefault();selectTab(tabs[next]);tabs[next].focus();
 };
}
// The firmware and this panel share an origin. Measure the body rather than
// the viewport so a taller previous tab cannot prevent the frame from shrinking.
const frame=window.frameElement;
if(frame && window.ResizeObserver){
 const fit=()=>{frame.style.height=Math.ceil(document.body.getBoundingClientRect().height)+'px';};
 new ResizeObserver(fit).observe(document.body,{box:'border-box'});
 fit();
}
let activityRequest=0;
function showActivity(panel,data){
 const list=panel.querySelector('.activity-list'),status=panel.querySelector('output');
 list.replaceChildren();
 if(!data){status.textContent='暂无运行数据，请确认代理已启动后刷新。';return;}
 const live=panel.id==='connections',rows=live?data.active:data.recent;
 status.textContent=live?'活动连接 '+data.total+' 条'+(rows.length<data.total?'，显示 '+rows.length+' 条':''):'最近访问 '+rows.length+' 条';
 for(const row of rows){
  const [source,entry]=live?row:[null,row];
  const item=document.createElement('article'),target=document.createElement('strong'),time=document.createElement('time'),detail=document.createElement('small');
  target.textContent=(entry.target.includes(':')?'['+entry.target+']':entry.target)+':'+entry.port;
  time.textContent=new Date(entry.time*1000).toLocaleTimeString();
  const fields=[entry.ingress+' / '+entry.transport,'设备 '+entry.device,source,'出口 '+entry.outbound];
  if(!live)fields.push(({opened:'已建立',failed:'连接失败',rejected:'规则拒绝'})[entry.result]);
  detail.textContent=fields.filter(Boolean).join(' · ');
  item.append(target,time,detail);list.append(item);
 }
}
async function refreshActivity(panel){
 const request=++activityRequest;
 panel.querySelector('output').textContent='正在读取…';
 try{
  const res=await fetch('/axproxy-page.cgi',{cache:'no-store'});
  if(!res.ok)throw Error();
  const page=new DOMParser().parseFromString(await res.text(),'text/html');
  const data=JSON.parse(page.getElementById('activity-data').textContent);
  if(request===activityRequest)showActivity(panel,data);
 }catch{
  if(request===activityRequest){
   panel.querySelector('.activity-list').replaceChildren();
   panel.querySelector('output').textContent='读取失败，请刷新或重新登录管理页。';
  }
 }
}
for(const id of ['connections','access']){
 const panel=byId(id);panel.querySelector('button').onclick=()=>refreshActivity(panel);
}
const release=byId('release'),checkRelease=byId('checkRelease'),installRelease=byId('installRelease'),releaseResult=byId('releaseResult');
let pollTimer;
function renderRelease(info){
 clearTimeout(pollTimer);
 const {phase,version,installed}=info;
 Object.assign(release.dataset,{phase,version,installed});
 const busy=['checking','upgrading'].includes(phase);
 checkRelease.disabled=busy;installRelease.hidden=phase!=='available';
 installRelease.disabled=busy;installRelease.textContent='升级到 v'+version;
 const messages={checking:'正在检查稳定版…',upgrading:'正在下载、校验并安装…',
  available:'发现稳定版 v'+version,current:'已是最新稳定版 v'+version,newer:'已安装版本高于稳定版 v'+version,
  done:'已完成升级到 v'+version,failed:'操作未完成，请重新检查版本。'};
 releaseResult.textContent=messages[phase]||'';
 if(busy)pollTimer=setTimeout(refreshRelease,1500);
}
async function refreshRelease(){
 try{
  const r=await fetch('/axproxy-page.cgi',{cache:'no-store'});
  if(!r.ok)throw Error();
  const next=new DOMParser().parseFromString(await r.text(),'text/html').getElementById('release');
  if(!next)throw Error();
  if(next.dataset.installed!==release.dataset.installed){location.reload();return;}
  renderRelease(next.dataset);
 }catch{releaseResult.textContent='暂时无法读取更新状态，正在重试…';pollTimer=setTimeout(refreshRelease,3000);}
}
async function releaseAction(action){
 const version=release.dataset.version;
 if(action==='upgrade'&&!confirm('升级到 v'+version+'？代理会短暂重连，成功后会删除旧版本。'))return;
 clearTimeout(pollTimer);checkRelease.disabled=true;installRelease.disabled=true;
 try{
  const body={component_action:action};if(action==='upgrade')body.version=version;
  const r=await fetch('/axproxy-save.cgi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok||!(await r.json()).ok)throw Error();
  await refreshRelease();
 }catch{await refreshRelease();if(!checkRelease.disabled)releaseResult.textContent='请求未完成，请重新检查版本。';}
}
checkRelease.onclick=()=>releaseAction('check');installRelease.onclick=()=>releaseAction('upgrade');
renderRelease(release.dataset);
function button(txt,fn){const b=document.createElement('button');b.type='button';b.textContent=txt;b.onclick=fn;return b;}
function choices(sel,values,current){sel.textContent='';for(const value of values){const o=document.createElement('option');o.value=value;o.textContent=value;sel.append(o);}sel.value=current;}
function field(box,key,title,value,opts){
 const l=document.createElement('label');l.textContent=title;const e=document.createElement(Array.isArray(opts)?'select':'input');e.dataset.key=key;
 if(Array.isArray(opts))choices(e,opts,value||opts[0]);else {e.type=opts||'text';e.value=value||'';}
 l.append(e);box.append(l);return e;
}
let nextNodeId=0;
function targets(){
 const entries=[['direct','direct'],['reject','reject']];
 for(const box of byId('nodes').children){
  entries.push([box.id,box.querySelector('[data-key=name]').value.trim()||'未命名节点']);
 }
 return entries;
}
function selectors(){return [byId('fallback'),...byId('rules').querySelectorAll('[data-key=outbound]')];}
function populate(select,selected){
 select.replaceChildren(...targets().map(([id,label])=>new Option(label,id)));
 select.value=selected;
}
function refresh(){for(const select of selectors())populate(select,select.value||'direct');}
function targetId(name){
 const item=targets().find(([,label])=>label===name);
 if(!item)throw Error('配置引用了不存在的出口：'+name);
 return item[0];
}
function outbound(select){
 if(['direct','reject'].includes(select.value))return select.value;
 const box=byId(select.value);
 if(!box)throw Error('请选择有效出口。');
 return box.querySelector('[data-key=name]').value.trim();
}
function entry(parent,title){
 const box=document.createElement('fieldset'),head=document.createElement('div');
 head.className='entry';const label=document.createElement('strong');label.textContent=title;
 const tools=document.createElement('div');tools.className='row-tools';head.append(label,tools);
 tools.append(button('删除',()=>{
  if(box.id && selectors().some(select=>select.value===box.id)){
   byId('result').textContent='该节点正在被引用，请先更改默认出口或对应规则。';return;
  }
  box.remove();refresh();
 }));
 box.append(head);parent.append(box);return box;
}
function node(data={}){
 const box=entry(byId('nodes'),'节点');
 box.id='node-'+(++nextNodeId);box.dataset.original=data.name||'';
 const name=field(box,'name','名称',data.name);
 name.required=true;name.pattern='[A-Za-z0-9_\\-]{1,48}';
 name.title='1 至 48 个英文字母、数字、下划线或连字符';name.oninput=refresh;
 box.querySelector('.row-tools').prepend(button('设为默认出口',()=>{
  byId('fallback').value=box.id;
  byId('result').textContent='默认出口已选中，保存并应用后生效。';
 }));
 const proto=field(box,'protocol','协议',data.protocol,['anytls','socks5','vless-reality']);
 const server=field(box,'server','服务器和端口',data.server);server.required=true;server.placeholder='proxy.example:443';
 const user=field(box,'username','用户名',data.username),secret=field(box,'secret','密码或 UUID','','password');secret.autocomplete='new-password';if(data.name)secret.placeholder='只改名称可留空，改变认证信息请重填';
 const sni=field(box,'server_name','TLS 服务器名',data.server_name),key=field(box,'public_key','REALITY 公钥',data.public_key),sid=field(box,'short_id','Short ID',data.short_id);
 const flow=field(box,'flow','VLESS flow',data.flow,['','xtls-rprx-vision']);
 function visible(el,on){el.disabled=!on;el.parentNode.style.display=on?'':'none';}
 function update(){visible(user,proto.value==='socks5');visible(sni,proto.value!=='socks5');for(const e of [key,sid,flow])visible(e,proto.value==='vless-reality');}
 proto.onchange=update;update();refresh();
}
function rule(data={}){
 const box=entry(byId('rules'),'匹配条件');field(box,'source','源 CIDR',data.source);field(box,'destination','目的 CIDR',data.destination);
 const network=field(box,'network','传输协议','',[]);
 network.replaceChildren(new Option('TCP 和 UDP',''),new Option('TCP','tcp'),new Option('UDP','udp'));network.value=data.network||'';
 const suffix=field(box,'domain_suffix','域名后缀',data.domain_suffix);suffix.pattern='([^.]+\\.)*[^.]+\\.?';suffix.title='填写域名或其后缀，例如 example.org';
 const port=field(box,'port','目的端口',data.port,'number');port.min=1;port.max=65535;
 const select=field(box,'outbound','出口','',[]);populate(select,targetId(data.outbound||'direct'));
 const tools=box.querySelector('.row-tools');
 tools.prepend(button('上移',()=>{if(box.previousElementSibling)box.previousElementSibling.before(box);}),
               button('下移',()=>{if(box.nextElementSibling)box.nextElementSibling.after(box);}));
}
function rows(id){
 return Array.from(byId(id).children,box=>{
  const obj=id==='nodes'?{previous_name:box.dataset.original}:{};
  for(const e of box.querySelectorAll('[data-key]')){
   if(e.disabled)continue;
   const k=e.dataset.key;
   const v=k==='outbound'?outbound(e):(k==='secret'?e.value:e.value.trim());
   if(v)obj[k]=k==='port'?Number(v):v;
  }
  return obj;
 });
}
function lockConfig(locked){
 for(const group of byId('settings').querySelectorAll('[data-config]'))group.inert=locked;
}
async function load(){
 const [r,s]=await Promise.all([fetch('/axproxy-state.cgi',{cache:'no-store'}),fetch('/axproxy-status.cgi',{cache:'no-store'})]);
 if(!r.ok||!s.ok)throw Error('无法读取配置，请重新登录管理页。');
 const c=await r.json();const status=(await s.text()).trim();byId('status').dataset.state=status;byId('status').textContent=({running:'运行中',degraded:'透明路由异常',stopped:'已停止',uninstalled:'未安装'}[status]||'状态未知');
 byId('listenPort').value=c.listen_port??6000;byId('enabled').checked=c.enabled;byId('devices').value=(c.devices||[]).join('\n');
 byId('rules').textContent='';byId('nodes').textContent='';(c.upstreams||[]).forEach(node);(c.rules||[]).forEach(rule);refresh();byId('fallback').value=targetId(c.default||'direct');
 lockConfig(false);
}
byId('newNode').onclick=()=>node();byId('newRule').onclick=()=>rule();
byId('settings').onsubmit=async e=>{
 e.preventDefault();
 const form=e.currentTarget;
 if(byId('parameters').inert)return;
 const invalid=form.querySelector('input:invalid,select:invalid,textarea:invalid');
 if(invalid){
  selectTab(byId(invalid.closest('[role="tabpanel"]').getAttribute('aria-labelledby')));
  invalid.focus();invalid.reportValidity();return;
 }
 const submit=e.submitter||document.querySelector('button[type=submit]');submit.disabled=true;const out=byId('result');out.textContent='正在应用…';
 try{const config={enabled:byId('enabled').checked,devices:byId('devices').value.trim().split(/\s+/).filter(Boolean),upstreams:rows('nodes'),rules:rows('rules'),default:outbound(byId('fallback'))};
 const port=byId('listenPort').valueAsNumber;
 if(port===7893){selectTab(byId('tab-general'));byId('listenPort').focus();throw Error('7893 已保留给透明代理，请选择其他端口。');}
 if(port!==6000)config.listen_port=port;
 const used=new Set(['direct','reject']);for(const n of config.upstreams){if(used.has(n.name)){selectTab(byId('tab-nodes'));throw Error('节点名称重复或为保留名称：'+n.name);}used.add(n.name);}
 lockConfig(true);
 const r=await fetch('/axproxy-save.cgi',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});
 if(!r.ok||!(await r.json()).ok)throw Error('应用失败，请检查监听端口是否被占用，以及节点和分流配置。');try{await load();}catch{out.textContent='已保存，状态读取失败，请刷新页面。';return;}out.textContent='已应用';}
 catch(err){lockConfig(false);out.textContent=err.message;}finally{submit.disabled=false;}};
load().catch(()=>{byId('result').textContent='无法读取配置，请重新登录管理页。';});
</script></html>
