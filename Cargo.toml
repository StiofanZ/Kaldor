[package]
name = "kaldor"
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
boring = "5"
tokio-boring = "5"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
ipnet = { version = "2", features = ["serde"] }
libc = "0.2"
meow-anytls = { version = "=0.29.0", default-features = false }
meow-common = { version = "=0.29.0", default-features = false }
meow-proxy = { version = "=0.29.0", default-features = false, features = ["vless-vision", "mux"] }
meow-transport = { version = "=0.29.0", default-features = false, features = ["reality"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "io-util", "time", "macros", "signal"] }
uuid = "1"

[profile.release]
opt-level = "s"
strip = true

[patch.crates-io]
meow-transport = { path = "third_party/meow-transport" }
