name: Publish Kaldor
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RUSTUP_TOOLCHAIN: 1.91.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          persist-credentials: false
      - name: Check release version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_TAG" == "v$version" ]]
      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake libclang-dev
          rustup toolchain install 1.91.1 --profile minimal --target armv7-unknown-linux-musleabihf
          echo 'ziglang==0.14.1 --hash=sha256:6eb9d4d759b292c83810dbee2e9e8e3fbfbf01d864e6e9811bae711fd74e1c2f' > "$RUNNER_TEMP/zig.txt"
          python3 -m pip install --require-hashes --no-deps --target "$RUNNER_TEMP/toolchain" -r "$RUNNER_TEMP/zig.txt"
          echo "ZIG=$RUNNER_TEMP/toolchain/ziglang/zig" >> "$GITHUB_ENV"
      - name: Build router and offline source packages
        run: |
          make package
          cd dist
          sha256sum -c SHA256SUMS
          readelf -h kaldor | grep -Eq 'Machine: +ARM$'
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "Kaldor $RELEASE_TAG" \
            --generate-notes dist/kaldor dist/kaldor-update dist/rt-ax89x.manifest dist/SHA256SUMS dist/*.tar.gz
